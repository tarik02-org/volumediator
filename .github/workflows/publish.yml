name: publish

on:
  release:
    types:
      - published

concurrency: ${{ github.workflow }}-${{ github.event.release.tag_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: resolve release version
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          release_version="${RELEASE_TAG#v}"
          test "$RELEASE_TAG" = "v$release_version"
          echo "version=$release_version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4.2.0

      - uses: docker/setup-buildx-action@v4.2.0

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: prepare image metadata
        id: metadata
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/volumediator
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }}

      - name: build and publish image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Containerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.release.outputs.version }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

      - uses: azure/setup-helm@v5.0.1

      - name: verify chart version
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          chart_version="$(helm show chart charts/volumediator | sed -n 's/^version: //p')"
          app_version="$(helm show chart charts/volumediator | sed -n 's/^appVersion: //p')"
          test "$chart_version" = "$RELEASE_VERSION"
          test "$app_version" = "$RELEASE_VERSION"

      - name: publish chart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm package charts/volumediator --destination "$RUNNER_TEMP"
          helm push "$RUNNER_TEMP/volumediator-${{ steps.release.outputs.version }}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
