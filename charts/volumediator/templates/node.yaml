apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: volumediator-node
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "volumediator.labels" . | nindent 4 }}
    app.kubernetes.io/component: node
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: volumediator
      app.kubernetes.io/component: node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: volumediator
        app.kubernetes.io/component: node
    spec:
      hostPID: true
      serviceAccountName: volumediator-node
      containers:
        - name: node
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - node
            - --node-name=$(NODE_NAME)
            - --scan-interval={{ .Values.node.scanInterval }}
            {{- range .Values.policy.allowedStorageClasses }}
            - --allow-storage-class={{ . }}
            {{- end }}
            {{- range .Values.policy.blockedStorageClasses }}
            - --block-storage-class={{ . }}
            {{- end }}
            {{- range .Values.policy.ext4ErrorStates }}
            - --ext4-error-state={{ . }}
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            {{- toYaml .Values.node.resources | nindent 12 }}
          securityContext:
            privileged: true
            readOnlyRootFilesystem: true
            runAsUser: 0
          volumeMounts:
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
            - name: host-sys
              mountPath: /host/sys
              readOnly: true
            - name: host-dev
              mountPath: /host/dev
              readOnly: true
            - name: host-kubelet
              mountPath: /var/lib/kubelet
              mountPropagation: Bidirectional
      volumes:
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
        - name: host-sys
          hostPath:
            path: /sys
            type: Directory
        - name: host-dev
          hostPath:
            path: /dev
            type: Directory
        - name: host-kubelet
          hostPath:
            path: /var/lib/kubelet
            type: Directory
